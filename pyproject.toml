[project]
name = "benchmark-recommender"
version = "0.1.0"
description = "Scores LLM benchmarks for whether they still discriminate, and ranks models downstream of that."
# Pinned deliberately. `uv venv` with no version silently picked macOS's
# system Python 3.9 — end-of-life, and it printed an OpenSSL warning on
# every run for weeks before anyone noticed.
requires-python = ">=3.12"
dependencies = [
    "huggingface_hub>=1.0,<2.0",
    "gradio>=5.0,<6.0",
    "pandas>=2.2.0",
    "pyarrow>=16.0.0",
    "requests>=2.32.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
